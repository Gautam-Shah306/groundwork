services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./data/groundwork.db}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      SEED_ON_START: ${SEED_ON_START:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-2500}
      LLM_DISCOVERY_MAX_OUTPUT_TOKENS: ${LLM_DISCOVERY_MAX_OUTPUT_TOKENS:-6000}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-low}
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
      - ./knowledge:/app/knowledge:ro
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    ports:
      - "5173:5173"
    depends_on:
      - backend
